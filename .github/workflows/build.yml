name: Build & deploy OSV feeds

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h (offset to dodge the top-of-hour rush)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [generate.py, .github/workflows/build.yml]

# Least privilege: read the repo, write Pages, mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Generate feeds
        env:
          OSV_RSS_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 generate.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: feeds
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
