name: Build & deploy OSV feeds

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h (offset to dodge the top-of-hour rush)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [generate.py, .github/workflows/build.yml]

# contents:write so we can commit the refreshed feeds back (keeps the repo active,
# so the scheduled run is never auto-disabled, and gives a git history of changes).
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Generate feeds
        env:
          OSV_RSS_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 generate.py
      - name: Commit refreshed feeds back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "feeds: refresh $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: feeds
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
